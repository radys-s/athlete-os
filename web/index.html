<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Athlete OS – rychlý gym tracker s vysvětlenou progresí.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Athlete OS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Athlete OS</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      function notice(text, buttonLabel, onClick) {
        var bar = document.createElement('div');
        bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;' +
          'padding:12px 16px;background:#a3c47b;color:#101510;font:15px sans-serif;' +
          'display:flex;gap:12px;align-items:center;justify-content:space-between';
        bar.textContent = text;
        if (buttonLabel) {
          var b = document.createElement('button');
          b.textContent = buttonLabel;
          b.style.cssText = 'padding:8px 14px;border:0;border-radius:8px;font:inherit';
          b.onclick = onClick;
          bar.appendChild(b);
        }
        document.body.appendChild(bar);
        return bar;
      }

      // Jedno okno = jedna databáze. Dvě záložky by si přepisovaly IndexedDB.
      if (navigator.locks) {
        navigator.locks.request('athlete-os-tab', { ifAvailable: true }, function (lock) {
          if (lock) return new Promise(function () {});
          var cover = document.createElement('div');
          cover.style.cssText = 'position:fixed;inset:0;z-index:100000;background:#101510;' +
            'color:#e8ece5;font:17px sans-serif;display:flex;align-items:center;' +
            'justify-content:center;text-align:center;padding:24px';
          cover.textContent = 'Athlete OS je otevřený v jiném okně. ' +
            'Zavři ho a načti tuto stránku znovu, aby se nepřepsala data.';
          document.body.appendChild(cover);
        });
      }

      if ('serviceWorker' in navigator &&
          (location.protocol === 'https:' || location.hostname === 'localhost' ||
           location.hostname === '127.0.0.1')) {
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (hadController) {
            notice('Je dostupná nová verze.', 'Načíst', function () { location.reload(); });
            hadController = false;
          }
        });
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('service_worker.js');
        });
      }
    })();
  </script>
</body>
</html>
